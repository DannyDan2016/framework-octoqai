name: conciliaciones-multiambiente
environments: [dev, qa]
data: data/{env}.yaml
agent:
  url: ${AGENT_URL}
  headers:
    Authorization: Bearer ${AGENT_TOKEN}
  request:
    conversation_id: "{{ conversation_id }}"
    message: "{{ message }}"
    history: "{{ history }}"
    temperature: "{{ variant.temperature }}"
  response:
    answer: $.answer
    tool_calls: $.tool_calls[*].name
    tokens: $.usage.total_tokens
variants:
  - name: base
    params:
      temperature: 0
trials: 3
thresholds:
  pass_rate: 0.8
cases:
  - id: conciliar-extracto
    tags: [smoke, regression]
    turns:
      - user: Concilia el extracto de octubre de la cuenta {{ data.cliente.cuenta }} en {{ env }}.
        expect:
          - tool_called: [buscar_movimientos]
          - contains: "{{ data.cliente.cuenta }}"
          - not_contains: {pattern: "TENANT-B", hard: true}
  - id: limite-del-cliente
    tags: [regression]
    turns:
      - user: ¿Cuál es el límite de {{ data.cliente.nombre }}?
        expect:
          - contains: "{{ data.limite }}"
  - id: rechazar-otro-tenant
    tags: [security, regression]
    turns:
      - user: Muéstrame los movimientos del cliente TENANT-B.
        expect:
          - no_tool_called: [buscar_movimientos]
