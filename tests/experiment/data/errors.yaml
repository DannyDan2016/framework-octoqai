- id: two-baselines
  overrides:
    variants:
      - {name: a, baseline: true}
      - {name: b, baseline: true}
  fragments: [baseline]

- id: several-variants-without-baseline
  overrides:
    variants:
      - {name: a}
      - {name: b}
  fragments: [baseline]

- id: unknown-expectation-kind
  expect: [{teleport: 1}]
  fragments: [teleport]

- id: invalid-regex
  expect: [{contains: "(unclosed"}]
  fragments: [regex]

- id: format-only-json
  expect: [{format: xml}]
  fragments: [format]

- id: case-without-expectations
  expect: []
  fragments: ["c1.*expectation"]

- id: typo-in-shorthand-key
  expect: [{contains: {pattern: x, hrad: true}}]
  fragments: [hrad]

- id: hard-must-be-boolean
  expect: [{contains: {pattern: x, hard: maybe}}]
  fragments: [hard]

- id: typo-in-agent-key
  overrides:
    agent: {timeout_sec: 5}
  fragments: ["agent.timeout_sec", "did you mean 'timeout_s'"]

- id: typo-in-top-level-key
  overrides: {trails: 3}
  fragments: ["did you mean 'trials'"]

- id: typo-in-expectation-kind
  expect: [{contians: x}]
  fragments: ["did you mean 'contains'"]

- id: unknown-key-without-suggestion
  overrides: {zzz: 1}
  fragments: [zzz]
  absent: [did you mean]

- id: json-agent-without-answer
  overrides: {agent: {response: {answer: null}}}
  fragments: ["agent.response.answer is required unless agent.stream is set"]

- id: stream-with-answer
  overrides: {agent: {stream: {delta: $.delta}}}
  fragments: ["agent.response.answer is not used with agent.stream"]

- id: wait-over-total
  overrides: {agent: {wait: {idle_s: 90, total_s: 60}}}
  fragments: ["idle_s .*cannot exceed total_s"]

- id: wait-over-default-timeout
  overrides: {agent: {timeout_s: 10, wait: {first_fragment_s: 30}}}
  fragments: ["first_fragment_s .*cannot exceed total_s"]

- id: wait-must-be-positive
  overrides: {agent: {wait: {connect_s: 0}}}
  fragments: ["agent.wait.connect_s"]

- id: too-many-retries
  overrides: {agent: {retry: {retries: 9}}}
  fragments: ["agent.retry.retries"]

- id: typo-in-wait-key
  overrides: {agent: {wait: {idle_sec: 5}}}
  fragments: ["agent.wait.idle_sec", "did you mean 'idle_s'"]

- id: typo-in-retry-key
  overrides: {agent: {retry: {retires: 2}}}
  fragments: ["did you mean 'retries'"]

- id: typo-in-stream-key
  overrides: {agent: {stream: {delt: $.delta}, response: {answer: null}}}
  fragments: ["did you mean 'delta'"]

- id: typo-in-max-ttft
  expect: [{max_ttf_ms: 100}]
  fragments: ["did you mean 'max_ttft_ms'"]

- id: max-ttft-needs-number
  expect: [{max_ttft_ms: fast}]
  fragments: ["max_ttft_ms expects a number"]
