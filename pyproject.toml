[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[project]
name = "octoqai"
version = "0.0.1"
description = "Octoqai: QA framework that evaluates AI agents with business-driven experiments and statistically sound A/B comparisons."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.3,<7",
    "httpx>=0.28,<1",
    "jsonpath-ng>=1.15,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17.3,<0.18",
    "mypy>=2.4,<3",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
octoqai = "octoqai.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/octoqai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "D", "C90", "PLR"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
