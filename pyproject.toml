[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[project]
name = "octoqai"
version = "0.0.1"
description = "Octoqai: QA framework that evaluates AI agents with business-driven experiments and statistically sound A/B comparisons."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.3,<7",
    "httpx>=0.28,<1",
    "jsonpath-ng>=1.15,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17.3,<0.18",
    "mypy>=2.4,<3",
    "types-PyYAML>=6.0,<7",
    "import-linter>=2.15,<3",
]

[project.scripts]
octoqai = "octoqai.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/octoqai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--strict-markers -ra --import-mode=importlib"
markers = [
    "unit: fast tests of one module in isolation",
    "integration: tests that wire several packages together",
    "e2e: tests against a real local agent process",
    "quality: style, hygiene, architecture and layout checks",
    "smoke: one to three happy-path tests per package",
    "regression: the full behavioural suite",
    "security: secrets, hygiene and headers",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "D", "C90", "PLR"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.isort]
known-first-party = ["octoqai", "support"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests/support"]

[tool.importlinter]
root_package = "octoqai"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers from the CLI down to shared errors"
type = "layers"
layers = [
    "octoqai.cli",
    "octoqai.reports",
    "octoqai.verdict",
    "octoqai.running",
    "octoqai.expectations",
    "octoqai.agents",
    "octoqai.stats | octoqai.experiment",
    "octoqai.errors",
]

[[tool.importlinter.contracts]]
name = "httpx only inside agents and cli"
type = "forbidden"
source_modules = [
    "octoqai.errors",
    "octoqai.experiment",
    "octoqai.stats",
    "octoqai.expectations",
    "octoqai.running",
    "octoqai.verdict",
    "octoqai.reports",
]
forbidden_modules = ["httpx"]

[[tool.importlinter.contracts]]
name = "The runner only knows the agent port"
type = "forbidden"
source_modules = ["octoqai.running"]
forbidden_modules = ["octoqai.agents.http_json"]

[[tool.importlinter.contracts]]
name = "Statistics are pure"
type = "forbidden"
source_modules = ["octoqai.stats"]
forbidden_modules = [
    "octoqai.experiment",
    "octoqai.agents",
    "octoqai.expectations",
    "octoqai.running",
    "octoqai.verdict",
    "octoqai.reports",
    "octoqai.cli",
]
